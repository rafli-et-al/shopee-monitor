name: CD Pipeline - Deploy to VPS

on:
  push:
    branches: [ main, master, develop, 'develop/**', 'develop/master' ]

concurrency:
  group: deploy-vps-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set Environment Variables
        id: env-vars
        run: |
          LOWER_REPO=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "IMAGE_NAME=$LOWER_REPO" >> $GITHUB_ENV

          case "${{ github.ref }}" in
            *develop*)
              echo "ENV_NAME=qa" >> $GITHUB_OUTPUT
              echo "PROJECT_NAME=shopee-qa" >> $GITHUB_OUTPUT
              echo "DOCKER_TAG=qa" >> $GITHUB_OUTPUT
              echo "COMPOSE_FILE=docker-compose.qa.yml" >> $GITHUB_OUTPUT
              ;;
            *)
              echo "ENV_NAME=prod" >> $GITHUB_OUTPUT
              echo "PROJECT_NAME=shopee-prod" >> $GITHUB_OUTPUT
              echo "DOCKER_TAG=latest" >> $GITHUB_OUTPUT
              echo "COMPOSE_FILE=docker-compose.yml" >> $GITHUB_OUTPUT
              ;;
          esac

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ steps.env-vars.outputs.DOCKER_TAG }}
            type=sha,format=short

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
        if: env.VPS_HOST != ''
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            cd ${{ secrets.VPS_APP_DIR || '~/shopee-monitor' }}
            git pull || true
            echo "${{ secrets.GITHUB_TOKEN }}" | sudo docker login ghcr.io -u ${{ github.actor }} --password-stdin
            sudo docker compose -p ${{ steps.env-vars.outputs.PROJECT_NAME }} -f ${{ steps.env-vars.outputs.COMPOSE_FILE }} pull || true
            sudo docker compose -p ${{ steps.env-vars.outputs.PROJECT_NAME }} -f ${{ steps.env-vars.outputs.COMPOSE_FILE }} stop || true
            sudo docker compose -p ${{ steps.env-vars.outputs.PROJECT_NAME }} -f ${{ steps.env-vars.outputs.COMPOSE_FILE }} rm -f || true
            sudo docker compose -p ${{ steps.env-vars.outputs.PROJECT_NAME }} -f ${{ steps.env-vars.outputs.COMPOSE_FILE }} up -d --remove-orphans

