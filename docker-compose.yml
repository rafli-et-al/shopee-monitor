version: '3.8'

services:
  shopee-monitor:
    build:
      context: .
      dockerfile: Dockerfile
    image: shopee-monitor:latest
    container_name: shopee-monitor-app
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      - PORT=3000
      - NODE_ENV=production
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}
      - STOCK_CHECK_CRON=${STOCK_CHECK_CRON:-0 */6 * * *}
      - PRICE_CHECK_CRON=${PRICE_CHECK_CRON:-0 * * * *}
    volumes:
      - ./data:/app/data
