services:
  shopee-monitor:
    build:
      context: .
      dockerfile: Dockerfile
    image: ghcr.io/rafli-et-al/shopee-monitor:latest
    container_name: shopee-monitor-app
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      - PORT=3000
      - NODE_ENV=production
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}
      - STOCK_CHECK_CRON=${STOCK_CHECK_CRON:-0 */6 * * *}
      - ALLOW_DEV_SETTINGS=${ALLOW_DEV_SETTINGS:-false}
      - ENABLE_TELEGRAM_BOT_POLLING=true
    volumes:
      - ./data:/app/data
