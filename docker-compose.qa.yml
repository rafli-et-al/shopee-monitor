services:
  shopee-monitor-qa:
    build:
      context: .
      dockerfile: Dockerfile
    image: ghcr.io/rafli-et-al/shopee-monitor:qa
    container_name: shopee-monitor-qa
    restart: unless-stopped
    ports:
      - "${QA_PORT:-3001}:3000"
    environment:
      - PORT=3000
      - NODE_ENV=development
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}
      - STOCK_CHECK_CRON=${STOCK_CHECK_CRON:-0 */6 * * *}
      - ENABLE_TELEGRAM_BOT_POLLING=false
    volumes:
      - ./data/qa:/app/data
